# ===================================================================
# TalentFlow ATS Spring Boot Application Configuration
# ===================================================================

# Server Configuration
server.port=8000
server.servlet.context-path=/

# Application
spring.application.name=TalentFlow-ATS-Backend

# Database Persistence (File-based H2 Database for Zero-Config Execution)
spring.datasource.url=jdbc:h2:file:./dev;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate & JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Web Console (accessible for debugging via /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Jackson JSON Serialization (Snake Case naming for 100% TypeScript Frontend Compatibility)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom ATS Properties
ats.jwt.secret=9941a525df1f4f89d38c11e74f8819d4536766d34b2ea674b09b5528ad503901
ats.jwt.expiration-minutes=43200
ats.upload.dir=./uploads/documents

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha

# Spring Boot Actuator & Health Monitoring (ADR 0020)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Enterprise Applicant Tracking System Backend
info.app.version=1.0.0
