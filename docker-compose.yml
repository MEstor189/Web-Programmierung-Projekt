services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - ATS_UPLOAD_DIR=/app/uploads/documents
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/dev;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    volumes:
      - talentflow-db:/app/data
      - talentflow-uploads:/app/uploads/documents
    networks:
      - talentflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - talentflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  talentflow-db:
    name: talentflow-db
  talentflow-uploads:
    name: talentflow-uploads

networks:
  talentflow-network:
    name: talentflow-network
    driver: bridge
